<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada del blog de AutomateDoctor</title>
<link rel="stylesheet" href="fuentes/fuentes.css">
<style>
  :root{--violeta:#8037FF;--azul:#55A9F9;--titulo:#45454e;--suave:#7a7a85}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#F6F5FA}
  .lienzo{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Roboto,sans-serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(520px 420px at 6% 0%,rgba(128,55,255,.16),transparent 70%),
      radial-gradient(560px 460px at 100% 100%,rgba(85,169,249,.22),transparent 70%),
      #F6F5FA;}
  .puntos{position:absolute;inset:0;background-image:radial-gradient(rgba(95,95,95,.12) 1.2px,transparent 1.2px);background-size:26px 26px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%)}
  .barra{position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,var(--violeta),var(--azul))}

  .texto{position:absolute;left:76px;top:70px;width:640px;height:400px;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .etiqueta{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:#fff;
    box-shadow:0 0 0 1.5px #e6def7,0 6px 18px rgba(128,55,255,.08);
    font-family:"Noto Sans JP",Roboto,sans-serif;font-weight:500;font-size:20px;letter-spacing:.07em;text-transform:uppercase;color:var(--violeta)}
  .etiqueta::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(90deg,var(--violeta),var(--azul))}
  h1{font-family:Montserrat,sans-serif;font-weight:700;font-size:64px;line-height:1.14;letter-spacing:-.015em;color:var(--titulo);
    max-height:296px;overflow:hidden;text-wrap:balance}

  .pie{position:absolute;left:76px;bottom:52px;display:flex;align-items:center;gap:18px}
  .pie img{height:38px;width:auto;display:block}
  .pie span{font-size:19px;color:var(--suave);padding-left:18px;border-left:1.5px solid #d9d5e3}

  .tarjeta{position:absolute;right:80px;top:118px;width:300px;height:300px;border-radius:44px;background:rgba(255,255,255,.88);
    box-shadow:0 30px 60px rgba(60,40,120,.12),0 0 0 1.5px rgba(128,55,255,.10);display:flex;align-items:center;justify-content:center}
  .tarjeta::before{content:"";position:absolute;inset:44px;border-radius:50%;background:linear-gradient(90deg,rgba(128,55,255,.10),rgba(85,169,249,.14))}
  .tarjeta svg{position:relative;width:150px;height:150px}
  .chip{position:absolute;border-radius:16px;background:#fff;box-shadow:0 14px 30px rgba(60,40,120,.12)}
  .chip.a{right:330px;top:150px;width:78px;height:22px;border-radius:11px;background:linear-gradient(90deg,rgba(128,55,255,.85),rgba(85,169,249,.85))}
  .chip.b{right:56px;top:392px;width:120px;height:46px;display:flex;align-items:center;gap:8px;padding:0 14px}
  .chip.b i{display:block;height:8px;border-radius:4px;background:#ece8f6}
  .chip.b i:first-child{width:18px;height:18px;border-radius:50%;background:linear-gradient(90deg,var(--violeta),var(--azul))}
  .chip.b i:last-child{flex:1}
</style>
</head>
<body>
<div class="lienzo">
  <div class="puntos"></div>
  <div class="texto">
    <span class="etiqueta" id="cat">Categoría</span>
    <h1 id="titulo">Título de la entrada</h1>
  </div>
  <div class="tarjeta" id="icono"></div>
  <div class="chip a"></div>
  <div class="chip b"><i></i><i></i></div>
  <div class="pie"><img src="logo.png" alt=""><span>Blog para clínicas privadas</span></div>
  <div class="barra"></div>
</div>
<script>
  var ICONOS={
    'fisioterapia':'<circle cx="12" cy="4.5" r="2"/><path d="M4 9.5l8 1.8 8-1.8"/><path d="M12 11.3v5"/><path d="M8.3 22l3.7-5.7 3.7 5.7"/>',
    'podologia':'<path d="M8.6 13.2c0-2.6 1.5-4 3.4-4s3.3 1.5 3.3 4c0 2.9-1.1 4.2-1.1 6.4 0 1.8-1 3.2-2.4 3.2s-2.6-1.3-2.6-3.1c0-2.5-.6-3.6-.6-6.5z"/><circle cx="8.6" cy="5.8" r="1.4"/><circle cx="11.6" cy="4.4" r="1.4"/><circle cx="14.4" cy="4.9" r="1.2"/><circle cx="16.6" cy="6.5" r="1"/><circle cx="17.9" cy="8.7" r=".9"/>',
    'medicina-estetica':'<path d="M11 3l1.9 4.9 4.9 1.9-4.9 1.9L11 16.6l-1.9-4.9-4.9-1.9 4.9-1.9z"/><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/><path d="M5.5 16.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/>',
    'implante-capilar':'<path d="M6 21v-6.5a6 6 0 0 1 12 0V21"/><path d="M6.3 11.5C7 7 9.4 4 12 4s5 3 5.7 7.5"/><path d="M9.2 6.6c.2 2.2 1 3.6 2.4 4.6"/><path d="M12.4 4.6c.1 2.6.8 4.3 2.2 5.6"/>',
    'captacion-de-pacientes':'<path d="M5 4h4v8.5a3 3 0 0 0 6 0V4h4v8.5a7 7 0 0 1-14 0z"/><path d="M5 8.5h4M15 8.5h4"/>',
    'ia-y-automatizacion':'<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9.5 15l1.6-6h1.8l1.6 6M10.1 12.8h3.8"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
    'abrir-clinica':'<path d="M20 10c0 6.5-8 12-8 12s-8-5.5-8-12a8 8 0 0 1 16 0z"/><path d="M12 7v6M9 10h6"/>',
    'casos-de-exito':'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/><path d="M3 21h18"/>',
    'novedades':'<path d="M3 10.5v3a1 1 0 0 0 1 1h3l5.5 4.5V5L7 9.5H4a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.8 6.2a8 8 0 0 1 0 11.6"/>',
    'actualidad-del-sector':'<rect x="3" y="4" width="14" height="16" rx="2"/><path d="M17 8h3a1 1 0 0 1 1 1v9a2 2 0 0 1-4 0"/><path d="M6.5 8.5h7M6.5 12h7M6.5 15.5h4.5"/>',
    '_':'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
  };
  var d={}; try{ d=JSON.parse(decodeURIComponent(location.hash.slice(1))||'{}'); }catch(e){}
  document.getElementById('cat').textContent=d.categoria||'Blog de AutomateDoctor';
  document.getElementById('titulo').textContent=d.titulo||'Título de la entrada';
  document.getElementById('icono').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
    '<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="22" y2="0"><stop offset="0" stop-color="#8037FF"/><stop offset="1" stop-color="#55A9F9"/></linearGradient></defs>'+
    (ICONOS[d.slug_categoria]||ICONOS._)+'</svg>';
  /* Ajuste del título: baja el tamaño hasta que quepa en 4 líneas como máximo */
  document.fonts.ready.then(function(){
    var h=document.getElementById('titulo'), t=64;
    while(t>40&&h.scrollHeight>h.clientHeight+1){ t-=2; h.style.fontSize=t+'px'; }
    document.body.dataset.listo=String(t);
  });
</script>
</body>
</html>
